# Situs statis: tidak ada build command, folder utama repo langsung dipublikasikan.
[build]
  publish = "."
  # Hemat kredit Netlify (paket gratis: sekitar 20 deploy produksi per bulan).
  # Deploy hanya jalan kalau index.html, css/, js/, atau data/ berubah.
  # Commit yang hanya mengubah docs/ atau README.md dilewati.
  # Build pertama selalu jalan. Jangan ubah baris ini.
  ignore = "{ [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; } && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html css js data"
